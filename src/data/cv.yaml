agents:
  title: Agent-driven Engineering
  projects:
    - name: Multi-repository agent workstation
      tag: private
      text: >-
        One working tree over my repositories, adapted from the knowledge base
        I built at work, so an agent sees a job that spans several
        repositories as one context. Claude Code, Codex and pi agents follow a
        written contract: tiered process, playbooks, decision records, local
        gates before every commit, and pushes only with my approval.
    - name: asobi
      tag: Rust
      href: https://github.com/azusachino/asobi
      text: >-
        Knowledge-graph CLI and server that lets agents pick up tasks,
        decisions and known pitfalls across sessions and machines instead of
        rediscovering them.
    - name: ochna
      tag: Rust
      href: https://github.com/azusachino/ochna
      text: >-
        Indexes Rust, Go, Java, C, C++ and Zig code into a symbol and call
        graph, so agents can answer "who calls this?" without reading whole
        files.

