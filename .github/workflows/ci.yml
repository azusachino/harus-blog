name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up tools with mise
        uses: jdx/mise-action@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run build and lint checks
        run: make check
