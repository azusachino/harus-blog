site_name: Idealistic Daydreamer
site_url: https://azusachino.icu
site_author: haru
site_description: palette gives you the capability, but you're the source of possibility.

validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: ignore

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.ico
  icon:
    logo: material/palette
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/giscus.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/azusachino
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/azusachino
    - icon: fontawesome/solid/infinity
      link: https://harus-note.notion.site/harusDocs-1737242dc8218043a2e0e2fca24a5cd5
    - icon: fontawesome/solid/person-running
      link: https://azusachino.github.io/running_page/
  analytics:
    provider: google
    property: G-59FEKVM9G5

hooks:
  - hooks/shortcodes.py
  - hooks/frontmatter.py
  - hooks/autonav.py

plugins:
  - search
  - tags
  - blog:
      blog_dir: tech
      blog_toc: true
      archive: false
      draft_if_future_date: true
      post_url_format: "{slug}"
      # Single unlimited index — keep scrolling to see every post, no
      # easy-to-miss "next page" link.
      pagination_per_page: 100
  - blog:
      blog_dir: journal
      blog_toc: true
      archive: true
      archive_name: By year
      archive_date_format: yyyy
      archive_url_date_format: yyyy
      draft_if_future_date: true
      categories: false
      post_url_format: "{slug}"
  - blog:
      blog_dir: life
      blog_toc: true
      archive: false
      draft_if_future_date: true
      categories: false
      post_url_format: "{slug}"
  - glightbox
  # Image compression — needs pngquant/pngcrush/optipng (+svgo) on PATH.
  # Off by default so `make build` stays green; run with OPTIMIZE=true to enable.
  - optimize:
      enabled: !ENV [OPTIMIZE, false]

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  # Honour 2-space nested lists (CommonMark/Obsidian style) instead of
  # Python-Markdown's default 4-space requirement.
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true

nav:
  - Home: index.md
  - Tech:
      - tech/index.md
      - Series: [] # children auto-generated by hooks/autonav.py (filename order)
  - Journal:
      - journal/index.md
  - Life:
      - life/index.md
  - About: about.md
  - CV: cv.md
